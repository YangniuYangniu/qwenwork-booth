<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>电商营销，都用千问办公</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: linear-gradient(160deg, #00C48C 0%, #00A3B5 100%);
    min-height: 100vh;
    padding: 14px 12px 28px;
    color: #333;
  }

  .card {
    background: #fff;
    border-radius: 24px;
    padding: 22px 18px;
    max-width: 420px;
    margin: 0 auto;
    box-shadow:
      0 1px 2px rgba(0, 120, 90, 0.04),
      0 8px 24px rgba(0, 120, 90, 0.08),
      0 24px 48px rgba(0, 120, 90, 0.06);
    border: 1px solid rgba(0, 196, 140, 0.06);
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 16px;
    padding: 14px 12px 12px;
  }
  .header h1 {
    font-size: 24px;
    font-weight: 800;
    color: #1a1a2e;
    line-height: 1.35;
    margin-bottom: 8px;
    letter-spacing: 0.3px;
  }
  .header h1 span {
    color: #00B894;
  }
  .header .scene {
    font-size: 13px;
    color: #777;
    line-height: 1.55;
    font-weight: 400;
  }

  /* Field section */
  .field { margin-bottom: 14px; }
  .field-label {
    font-size: 13px;
    font-weight: 600;
    color: #444;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .field-label .icon {
    width: 17px;
    height: 17px;
    flex-shrink: 0;
    display: block;
  }
  .field-label .icon path,
  .field-label .icon line,
  .field-label .icon circle,
  .field-label .icon rect {
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  [data-field="name"] .icon { stroke: #00C48C; }
  [data-field="detail"] .icon { stroke: #00A3B5; }
  [data-field="price"] .icon { stroke: #E8A33D; }
  [data-field="audience"] .icon { stroke: #5CB85C; }

  .field-input {
    width: 100%;
    border: 1.5px solid #dceee6;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    color: #333;
    background: #fafffc;
    transition: all 0.2s;
    outline: none;
    font-family: inherit;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.03);
  }
  .field-input:focus {
    border-color: #00C48C;
    background: #fff;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.02), 0 0 0 3px rgba(0, 196, 140, 0.1);
  }
  .field-input::placeholder { color: #b5b5b5; }

  /* Preset chips */
  .presets {
    display: flex;
    flex-wrap: nowrap;
    gap: 6px;
    margin-top: 7px;
    overflow: hidden;
  }
  .chip {
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 14px;
    border: 1px solid #c8eddf;
    background: #eef9f4;
    color: #2d8a6e;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
    font-weight: 500;
  }
  .chip:active, .chip:hover {
    background: #00C48C;
    color: #fff;
    border-color: #00C48C;
    transform: scale(0.96);
    box-shadow: 0 2px 8px rgba(0, 196, 140, 0.2);
  }
  .chip.ellipsis {
    border-style: dashed;
    color: #aaa;
    background: transparent;
    border-color: #d5d5d5;
  }
  .chip.ellipsis:hover {
    background: #f5f5f5;
    color: #888;
    border-color: #ccc;
    box-shadow: none;
  }

  /* Copy button */
  .btn-copy {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #00C48C 0%, #00A3B5 100%);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 6px;
    box-shadow: 0 4px 14px rgba(0, 196, 140, 0.3);
  }
  .btn-copy:active {
    transform: translateY(1px);
    box-shadow: 0 2px 8px rgba(0, 196, 140, 0.25);
  }
  .btn-copy.copied {
    background: linear-gradient(135deg, #38d9a9 0%, #20c997 100%);
    box-shadow: 0 4px 14px rgba(56, 217, 169, 0.3);
  }

  /* Open app button */
  .btn-app {
    width: 100%;
    padding: 12px;
    border: 1.5px solid rgba(0, 196, 140, 0.5);
    border-radius: 14px;
    background: #fff;
    color: #00B894;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 10px;
    text-decoration: none;
  }
  .btn-app:active {
    transform: translateY(1px);
    background: #f0faf6;
    border-color: #00C48C;
  }

  /* Preview */
  .preview-toggle {
    text-align: center;
    margin-top: 14px;
  }
  .preview-toggle a {
    font-size: 12px;
    color: #999;
    text-decoration: none;
    border-bottom: 1px dashed #ccc;
    padding-bottom: 2px;
    transition: color 0.2s;
  }
  .preview-toggle a:hover { color: #00C48C; border-color: #00C48C; }
  .preview-box {
    display: none;
    margin-top: 12px;
    padding: 14px;
    background: linear-gradient(135deg, #f4fbf8 0%, #f0faf6 100%);
    border-radius: 12px;
    border: 1px solid #d4f0e4;
  }
  .preview-box.show { display: block; }
  .preview-box pre {
    font-size: 12.5px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
    color: #555;
    font-family: inherit;
  }
  .preview-box .highlight {
    background: rgba(0, 196, 140, 0.12);
    color: #0a7c5a;
    padding: 2px 5px;
    border-radius: 4px;
    font-weight: 500;
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 14px 28px;
    border-radius: 12px;
    font-size: 14px;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 999;
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>电商营销，都用<span>千问办公</span></h1>
    <p class="scene">仓库里堆满了卖不动的货？<br>交给千问办公，三句话让人忍不住下单！</p>
  </div>

<!-- 产品名称 -->
  <div class="field" data-field="name">
    <div class="field-label"><svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><circle cx="7" cy="7" r="1.5" fill="currentColor" stroke="none"/></svg> 产品名称</div>
    <input class="field-input" id="productName" type="text" value="桌面迷你加湿器" placeholder="输入产品名称">
    <div class="presets">
      <span class="chip" data-target="productName">保温杯</span>
      <span class="chip" data-target="productName">蓝牙耳机</span>
      <span class="chip" data-target="productName">充电宝</span>
      <span class="chip ellipsis" data-target="productName">...</span>
    </div>
  </div>

  <!-- 产品细节 -->
  <div class="field" data-field="detail">
    <div class="field-label"><svg class="icon" viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3h6v2H9z"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="9" y1="14" x2="15" y2="14"/><line x1="9" y1="18" x2="13" y2="18"/></svg> 产品细节</div>
    <input class="field-input" id="productDetail" type="text" value="USB 供电，水箱 300ml，出雾细腻" placeholder="输入产品细节、卖点">
    <div class="presets">
      <span class="chip" data-target="productDetail">续航 8 小时</span>
      <span class="chip" data-target="productDetail">静音设计</span>
      <span class="chip" data-target="productDetail">轻便小巧</span>
      <span class="chip ellipsis" data-target="productDetail">...</span>
    </div>
  </div>

  <!-- 售价 -->
  <div class="field" data-field="price">
    <div class="field-label"><svg class="icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9"/><path d="M8.5 8l3.5 5 3.5-5M12 13v4"/></svg> 售价</div>
    <input class="field-input" id="productPrice" type="text" value="59 元" placeholder="输入售价">
    <div class="presets">
      <span class="chip" data-target="productPrice">99 元</span>
      <span class="chip" data-target="productPrice">199 元</span>
      <span class="chip" data-target="productPrice">49 元</span>
      <span class="chip ellipsis" data-target="productPrice">...</span>
    </div>
  </div>

  <!-- 目标人群 -->
  <div class="field" data-field="audience">
    <div class="field-label"><svg class="icon" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="7" r="3.5"/><path d="M2 20c0-3.5 3-6.5 7-6.5s7 3 7 6.5"/><circle cx="17" cy="8" r="2.5"/><path d="M17 13.5c2.5 0 5 2 5 5"/></svg> 目标人群</div>
    <input class="field-input" id="targetAudience" type="text" value="办公室白领" placeholder="输入目标用户">
    <div class="presets">
      <span class="chip" data-target="targetAudience">学生党</span>
      <span class="chip" data-target="targetAudience">宝妈</span>
      <span class="chip" data-target="targetAudience">数码控</span>
      <span class="chip ellipsis" data-target="targetAudience">...</span>
    </div>
  </div>

<!-- 复制按钮 -->
  <button class="btn-copy" id="btnCopy" onclick="copyPrompt()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
    复制提示词
  </button>

  <!-- 打开千问办公 -->
  <a class="btn-app" href="https://qwenwork.cn/app" target="_blank" onclick="openApp()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    打开千问办公，粘贴发送
  </a>

  <!-- 预览提示词 -->
  <div class="preview-toggle">
    <a href="javascript:void(0)" onclick="togglePreview()">查看完整提示词 ↓</a>
  </div>
  <div class="preview-box" id="previewBox">
    <pre id="previewContent"></pre>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  var CARD_ID = '电商营销';

  // === 打点追踪 ===
  var TRACKING_URL = 'YOUR_GOOGLE_APPS_SCRIPT_URL';
  function trackEvent(action) {
    try {
      var data = JSON.stringify({
        card: CARD_ID,
        action: action,
        ts: new Date().toISOString(),
        ua: navigator.userAgent
      });
      if (navigator.sendBeacon) {
        navigator.sendBeacon(TRACKING_URL, new Blob([data], {type: 'application/json'}));
      } else {
        fetch(TRACKING_URL, {method: 'POST', body: data, headers: {'Content-Type': 'application/json'}, keepalive: true}).catch(function(){});
      }
    } catch(e) {}
  }

  // Chip click → fill input
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', function() {
      const target = this.dataset.target;
      const input = document.getElementById(target);
      const value = this.textContent.trim();
      if (value === '...') {
        input.focus();
        input.select();
        return;
      }
      if (target === 'productDetail' && input.value && !input.value.includes(value)) {
        input.value = input.value + '，' + value;
      } else {
        input.value = value;
      }
      input.focus();
      updatePreview();
    });
  });

  // Input change → update preview
  document.querySelectorAll('.field-input').forEach(input => {
    input.addEventListener('input', updatePreview);
  });

  // Build prompt
  function buildPrompt() {
    const name = document.getElementById('productName').value || '（产品名称）';
    const detail = document.getElementById('productDetail').value || '（产品细节）';
    const price = document.getElementById('productPrice').value || '（售价）';
    const audience = document.getElementById('targetAudience').value || '（目标人群）';

    return `你是一位电商文案高手。我现在有一款产品需要提炼卖点做营销：

产品名称：${name}
产品细节：${detail}
售价：${price}
目标人群：${audience}

请帮我输出：
1. 一句详情页主标题（制造反差感，15 字以内）
2. 三个卖点，每个用"痛点→产品→画面感"的结构，各一句话
3. 两条小红书风格种草文案（带 emoji，像真实用户分享）`;
  }

  // Update preview
  function updatePreview() {
    const prompt = buildPrompt();
    const name = document.getElementById('productName').value;
    const detail = document.getElementById('productDetail').value;
    const price = document.getElementById('productPrice').value;
    const audience = document.getElementById('targetAudience').value;

    let html = prompt
      .replace(name, `<span class="highlight">${name}</span>`)
      .replace(detail, `<span class="highlight">${detail}</span>`)
      .replace(price, `<span class="highlight">${price}</span>`)
      .replace(audience, `<span class="highlight">${audience}</span>`);
    document.getElementById('previewContent').innerHTML = html;
  }

  // Toggle preview
  function togglePreview() {
    const box = document.getElementById('previewBox');
    box.classList.toggle('show');
    const link = document.querySelector('.preview-toggle a');
    link.textContent = box.classList.contains('show') ? '收起完整提示词 ↑' : '查看完整提示词 ↓';
  }

  // Copy prompt — mobile-compatible
  function copyPrompt() {
    trackEvent('copy_prompt');
    const prompt = buildPrompt();
    const btn = document.getElementById('btnCopy');

    // Try modern Clipboard API first
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(prompt).then(() => {
        showCopied(btn);
      }).catch(() => {
        // Clipboard API failed (common on mobile), fall back
        fallbackCopy(prompt, btn);
      });
    } else {
      fallbackCopy(prompt, btn);
    }
  }

  function fallbackCopy(text, btn) {
    // Create a visible but off-screen textarea for mobile compatibility
    const ta = document.createElement('textarea');
    ta.value = text;
    // Make it visible but off-screen (mobile requires visible + selectable)
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.width = '2em';
    ta.style.height = '2em';
    ta.style.padding = '0';
    ta.style.border = 'none';
    ta.style.outline = 'none';
    ta.style.boxShadow = 'none';
    ta.style.background = 'transparent';
    ta.style.fontSize = '16px'; // prevent iOS zoom
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);

    try {
      const success = document.execCommand('copy');
      if (success) {
        showCopied(btn);
      } else {
        showToast('复制失败，请长按文字手动复制');
        showPromptForManualCopy(text);
      }
    } catch (err) {
      showToast('复制失败，请长按文字手动复制');
      showPromptForManualCopy(text);
    }

    document.body.removeChild(ta);
  }

  function showPromptForManualCopy(text) {
    const box = document.getElementById('previewBox');
    const content = document.getElementById('previewContent');
    content.textContent = text;
    box.classList.add('show');
    const link = document.querySelector('.preview-toggle a');
    link.textContent = '收起 ↑';
  }

  function showCopied(btn) {
    btn.classList.add('copied');
    btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> 已复制！`;
    showToast('提示词已复制到剪贴板');
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> 复制提示词`;
    }, 2000);
  }

  // Open app
  function openApp() {
    trackEvent('open_app');
    showToast('打开千问办公，粘贴提示词即可使用');
  }

  // Toast
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  // Init preview
  updatePreview();
</script>
</body>
</html>
