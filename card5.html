<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>面试提纲设计，都用千问办公</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: linear-gradient(160deg, #00C48C 0%, #00A3B5 100%);
    min-height: 100vh;
    padding: 14px 12px 28px;
    color: #333;
  }

  .card {
    background: #fff;
    border-radius: 24px;
    padding: 22px 18px;
    max-width: 420px;
    margin: 0 auto;
    box-shadow:
      0 1px 2px rgba(0, 120, 90, 0.04),
      0 8px 24px rgba(0, 120, 90, 0.08),
      0 24px 48px rgba(0, 120, 90, 0.06);
    border: 1px solid rgba(0, 196, 140, 0.06);
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 16px;
    padding: 14px 12px 12px;
  }
  .header h1 {
    font-size: 24px;
    font-weight: 800;
    color: #1a1a2e;
    line-height: 1.35;
    margin-bottom: 8px;
    letter-spacing: 0.3px;
  }
  .header h1 span {
    color: #00B894;
  }
  .header .scene {
    font-size: 13px;
    color: #777;
    line-height: 1.55;
    font-weight: 400;
  }

  /* Field section */
  .field { margin-bottom: 14px; }
  .field-label {
    font-size: 13px;
    font-weight: 600;
    color: #444;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .field-label .icon {
    width: 17px;
    height: 17px;
    flex-shrink: 0;
    display: block;
  }
  .field-label .icon path,
  .field-label .icon line,
  .field-label .icon circle,
  .field-label .icon rect {
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  [data-field="position"] .icon { stroke: #00C48C; }
  [data-field="experience"] .icon { stroke: #00A3B5; }
  [data-field="focus"] .icon { stroke: #E8A33D; }
  [data-field="duration"] .icon { stroke: #5CB85C; }

  .field-input {
    width: 100%;
    border: 1.5px solid #dceee6;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    color: #333;
    background: #fafffc;
    transition: all 0.2s;
    outline: none;
    font-family: inherit;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.03);
  }
  .field-input:focus {
    border-color: #00C48C;
    background: #fff;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.02), 0 0 0 3px rgba(0, 196, 140, 0.1);
  }
  .field-input::placeholder { color: #b5b5b5; }

  /* Preset chips */
  .presets {
    display: flex;
    flex-wrap: nowrap;
    gap: 6px;
    margin-top: 7px;
    overflow: hidden;
  }
  .chip {
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 14px;
    border: 1px solid #c8eddf;
    background: #eef9f4;
    color: #2d8a6e;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
    font-weight: 500;
  }
  .chip:active, .chip:hover {
    background: #00C48C;
    color: #fff;
    border-color: #00C48C;
    transform: scale(0.96);
    box-shadow: 0 2px 8px rgba(0, 196, 140, 0.2);
  }
  .chip.ellipsis {
    border-style: dashed;
    color: #aaa;
    background: transparent;
    border-color: #d5d5d5;
  }
  .chip.ellipsis:hover {
    background: #f5f5f5;
    color: #888;
    border-color: #ccc;
    box-shadow: none;
  }

  /* Copy button */
  .btn-copy {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #00C48C 0%, #00A3B5 100%);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 6px;
    box-shadow: 0 4px 14px rgba(0, 196, 140, 0.3);
  }
  .btn-copy:active {
    transform: translateY(1px);
    box-shadow: 0 2px 8px rgba(0, 196, 140, 0.25);
  }
  .btn-copy.copied {
    background: linear-gradient(135deg, #38d9a9 0%, #20c997 100%);
    box-shadow: 0 4px 14px rgba(56, 217, 169, 0.3);
  }

  /* Open app button */
  .btn-app {
    width: 100%;
    padding: 12px;
    border: 1.5px solid rgba(0, 196, 140, 0.5);
    border-radius: 14px;
    background: #fff;
    color: #00B894;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 10px;
    text-decoration: none;
  }
  .btn-app:active {
    transform: translateY(1px);
    background: #f0faf6;
    border-color: #00C48C;
  }

  /* Preview */
  .preview-toggle {
    text-align: center;
    margin-top: 14px;
  }
  .preview-toggle a {
    font-size: 12px;
    color: #999;
    text-decoration: none;
    border-bottom: 1px dashed #ccc;
    padding-bottom: 2px;
    transition: color 0.2s;
  }
  .preview-toggle a:hover { color: #00C48C; border-color: #00C48C; }
  .preview-box {
    display: none;
    margin-top: 12px;
    padding: 14px;
    background: linear-gradient(135deg, #f4fbf8 0%, #f0faf6 100%);
    border-radius: 12px;
    border: 1px solid #d4f0e4;
  }
  .preview-box.show { display: block; }
  .preview-box pre {
    font-size: 12.5px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
    color: #555;
    font-family: inherit;
  }
  .preview-box .highlight {
    background: rgba(0, 196, 140, 0.12);
    color: #0a7c5a;
    padding: 2px 5px;
    border-radius: 4px;
    font-weight: 500;
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 14px 28px;
    border-radius: 12px;
    font-size: 14px;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 999;
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>面试准备，都用<span>千问办公</span></h1>
    <p class="scene">明天要面试一个人，还没准备问题？<br>交给千问办公，一份拿来就能用的面试提纲！</p>
  </div>

<!-- 面试岗位 -->
  <div class="field" data-field="position">
    <div class="field-label"><svg class="icon" viewBox="0 0 24 24" fill="none"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/><line x1="12" y1="12" x2="12" y2="12.01"/></svg> 面试岗位</div>
    <input class="field-input" id="position" type="text" value="新媒体运营" placeholder="输入岗位名称">
    <div class="presets">
      <span class="chip" data-target="position">产品经理</span>
      <span class="chip" data-target="position">设计师</span>
      <span class="chip" data-target="position">运营</span>
      <span class="chip ellipsis" data-target="position">...</span>
    </div>
  </div>

  <!-- 工作年限 -->
  <div class="field" data-field="experience">
    <div class="field-label"><svg class="icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg> 工作年限</div>
    <input class="field-input" id="experience" type="text" value="3 年" placeholder="要求工作年限">
    <div class="presets">
      <span class="chip" data-target="experience">1-3 年</span>
      <span class="chip" data-target="experience">3-5 年</span>
      <span class="chip" data-target="experience">5 年以上</span>
      <span class="chip ellipsis" data-target="experience">...</span>
    </div>
  </div>

  <!-- 考察重点 -->
  <div class="field" data-field="focus">
    <div class="field-label"><svg class="icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg> 考察重点</div>
    <input class="field-input" id="focus" type="text" value="内容策划能力" placeholder="最想了解什么">
    <div class="presets">
      <span class="chip" data-target="focus">专业能力</span>
      <span class="chip" data-target="focus">沟通表达</span>
      <span class="chip" data-target="focus">团队协作</span>
      <span class="chip ellipsis" data-target="focus">...</span>
    </div>
  </div>

  <!-- 面试时长 -->
  <div class="field" data-field="duration">
    <div class="field-label"><svg class="icon" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="10" y1="14" x2="14" y2="14"/><line x1="12" y1="12" x2="12" y2="16"/></svg> 面试时长</div>
    <input class="field-input" id="duration" type="text" value="40 分钟" placeholder="面试时长">
    <div class="presets">
      <span class="chip" data-target="duration">30 分钟</span>
      <span class="chip" data-target="duration">45 分钟</span>
      <span class="chip" data-target="duration">1 小时</span>
      <span class="chip ellipsis" data-target="duration">...</span>
    </div>
  </div>

<!-- 复制按钮 -->
  <button class="btn-copy" id="btnCopy" onclick="copyPrompt()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
    复制提示词
  </button>

  <!-- 打开千问办公 -->
  <a class="btn-app" href="https://qwenwork.cn/app" target="_blank" onclick="openApp()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    打开千问办公，粘贴发送
  </a>

  <!-- 预览提示词 -->
  <div class="preview-toggle">
    <a href="javascript:void(0)" onclick="togglePreview()">查看完整提示词 ↓</a>
  </div>
  <div class="preview-box" id="previewBox">
    <pre id="previewContent"></pre>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  var CARD_ID = '面试准备';

  // === 打点追踪 ===
  var TRACKING_URL = 'https://script.google.com/macros/s/AKfycbypA3nkgboWPE_ZZugyG8NtihAwt2fzpL7Sr3eiqjnQx7zuc-nnOlundO9gToSr53Ln/exec';
  function trackEvent(action) {
    try {
      var data = JSON.stringify({
        card: CARD_ID,
        action: action,
        ts: new Date().toISOString(),
        ua: navigator.userAgent
      });
      if (navigator.sendBeacon) {
        navigator.sendBeacon(TRACKING_URL, new Blob([data], {type: 'application/json'}));
      } else {
        fetch(TRACKING_URL, {method: 'POST', body: data, headers: {'Content-Type': 'application/json'}, keepalive: true}).catch(function(){});
      }
    } catch(e) {}
  }

  // Chip click → fill input
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', function() {
      const target = this.dataset.target;
      const input = document.getElementById(target);
      const value = this.textContent.trim();
      if (value === '...') {
        input.focus();
        input.select();
        return;
      }
      input.value = value;
      input.focus();
      updatePreview();
    });
  });

  // Input change → update preview
  document.querySelectorAll('.field-input').forEach(input => {
    input.addEventListener('input', updatePreview);
  });

  // Build prompt
  function buildPrompt() {
    const position = document.getElementById('position').value || '（面试岗位）';
    const experience = document.getElementById('experience').value || '（工作年限）';
    const focus = document.getElementById('focus').value || '（考察重点）';
    const duration = document.getElementById('duration').value || '（面试时长）';
    return `你是一位资深 HR。我明天要面试一个候选人，岗位信息如下：

岗位：${position}（工作${experience}经验）
我最想考察的点：${focus}
面试时长：${duration}

请给我一份面试提纲：
1. 暖场（1 个问题，让候选人放松）
2. 经历深挖（2 个问题 + 每个问题后一个追问方向）
3. 实战模拟（1 个现场小任务，比如给一个场景让 TA 现场说思路）
4. 协作和价值观（1 个问题）
5. 候选人反问（预留 5 分钟）

每个问题后标注：好的回答应该体现什么能力。`;
  }

  // Update preview
  function updatePreview() {
    const prompt = buildPrompt();
    const position = document.getElementById('position').value;
    const experience = document.getElementById('experience').value;
    const focus = document.getElementById('focus').value;
    const duration = document.getElementById('duration').value;

    let html = prompt
      .replace(position, `<span class="highlight">${position}</span>`)
      .replace(experience, `<span class="highlight">${experience}</span>`)
      .replace(focus, `<span class="highlight">${focus}</span>`)
      .replace(duration, `<span class="highlight">${duration}</span>`);
    document.getElementById('previewContent').innerHTML = html;
  }

  // Toggle preview
  function togglePreview() {
    const box = document.getElementById('previewBox');
    box.classList.toggle('show');
    const link = document.querySelector('.preview-toggle a');
    link.textContent = box.classList.contains('show') ? '收起完整提示词 ↑' : '查看完整提示词 ↓';
  }

  // Copy prompt — mobile-compatible
  function copyPrompt() {
    trackEvent('copy_prompt');
    const prompt = buildPrompt();
    const btn = document.getElementById('btnCopy');

    // Try modern Clipboard API first
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(prompt).then(() => {
        showCopied(btn);
      }).catch(() => {
        // Clipboard API failed (common on mobile), fall back
        fallbackCopy(prompt, btn);
      });
    } else {
      fallbackCopy(prompt, btn);
    }
  }

  function fallbackCopy(text, btn) {
    // Create a visible but off-screen textarea for mobile compatibility
    const ta = document.createElement('textarea');
    ta.value = text;
    // Make it visible but off-screen (mobile requires visible + selectable)
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.width = '2em';
    ta.style.height = '2em';
    ta.style.padding = '0';
    ta.style.border = 'none';
    ta.style.outline = 'none';
    ta.style.boxShadow = 'none';
    ta.style.background = 'transparent';
    ta.style.fontSize = '16px'; // prevent iOS zoom
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);

    try {
      const success = document.execCommand('copy');
      if (success) {
        showCopied(btn);
      } else {
        showToast('复制失败，请长按文字手动复制');
        showPromptForManualCopy(text);
      }
    } catch (err) {
      showToast('复制失败，请长按文字手动复制');
      showPromptForManualCopy(text);
    }

    document.body.removeChild(ta);
  }

  function showPromptForManualCopy(text) {
    const box = document.getElementById('previewBox');
    const content = document.getElementById('previewContent');
    content.textContent = text;
    box.classList.add('show');
    const link = document.querySelector('.preview-toggle a');
    link.textContent = '收起 ↑';
  }

  function showCopied(btn) {
    btn.classList.add('copied');
    btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> 已复制！`;
    showToast('提示词已复制到剪贴板');
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> 复制提示词`;
    }, 2000);
  }

  // Open app
  function openApp() {
    trackEvent('open_app');
    showToast('打开千问办公，粘贴提示词即可使用');
  }

  // Toast
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  // Init preview
  updatePreview();
</script>
</body>
</html>
